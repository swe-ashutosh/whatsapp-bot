<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genius Library • WhatsApp Bot Controller</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        wa: '#25D366',
                        wadark: '#128C7E',
                        navy: '#0A2E5C',
                        navydark: '#071F3D',
                        gold: '#FFC107'
                    }
                }
            }
        }
    </script>
    <style>
        @keyframes pulseSlow {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.85; transform: scale(1.02); }
        }
        .pulse-slow { animation: pulseSlow 3s infinite ease-in-out; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4 font-sans text-slate-800 antialiased">
    
    <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl overflow-hidden border border-slate-200/80 transition-all">
        
        <!-- Header -->
        <div class="bg-gradient-to-r from-navy to-navydark p-6 text-center text-white relative shadow-md">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-white/10 backdrop-blur-md mb-2 border border-white/20">
                <svg class="w-7 h-7 text-wa" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/>
                </svg>
            </div>
            <h1 class="text-xl font-black tracking-tight text-white">Genius Library</h1>
            <p class="text-xs text-slate-300 font-medium">WhatsApp Gateway & Automation Console</p>
            
            <div class="mt-3 inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-white/10 text-[11px] font-semibold text-gold border border-gold/30">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                <span>Password Protected Console</span>
            </div>
        </div>

        <!-- Dynamic Main Section -->
        <div id="mainContent" class="p-6">
            <div class="flex flex-col items-center justify-center py-12">
                <div class="h-8 w-8 border-4 border-navy border-t-transparent rounded-full animate-spin mb-3"></div>
                <p class="text-xs font-bold text-slate-400">Verifying Security Credentials...</p>
            </div>
        </div>

        <!-- Footer -->
        <div class="bg-slate-50 px-6 py-3 border-t border-slate-100 flex items-center justify-between text-[11px] text-slate-400 font-medium">
            <span>Genius Library Madhupur</span>
            <span>v2.0 Secure</span>
        </div>
    </div>

    <script>
        let pollTimer = null;

        function getToken() {
            return sessionStorage.getItem('genius_bot_token') || '';
        }

        function setToken(token) {
            if (token) {
                sessionStorage.setItem('genius_bot_token', token);
            } else {
                sessionStorage.removeItem('genius_bot_token');
            }
        }

        async function init() {
            const token = getToken();
            if (!token) {
                renderLoginForm();
                return;
            }

            try {
                const res = await fetch('/api/check-auth', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const data = await res.json();
                if (data.authenticated) {
                    renderDashboard(data.user);
                    checkStatus();
                    startPolling();
                } else {
                    setToken('');
                    renderLoginForm();
                }
            } catch (err) {
                renderLoginForm();
            }
        }

        function renderLoginForm(errorMsg = '') {
            if (pollTimer) clearInterval(pollTimer);
            const container = document.getElementById('mainContent');
            const errHtml = errorMsg ? `
                <div class="p-3 rounded-xl bg-red-50 border border-red-200 text-red-700 text-xs font-bold flex items-center gap-2 mb-3">
                    <svg class="w-4 h-4 shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/></svg>
                    <span>${errorMsg}</span>
                </div>
            ` : '';

            container.innerHTML = `
                <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
                    <div class="text-center mb-4">
                        <h2 class="text-base font-bold text-navy">Admin Login Required</h2>
                        <p class="text-xs text-slate-500 mt-0.5">Only authorized library admins can access or control this WhatsApp bot.</p>
                    </div>

                    ${errHtml}

                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">Admin ID / Email</label>
                        <input 
                            type="text" 
                            id="loginUsername" 
                            required 
                            value="geniuslibrarymadhupur@gmail.com" 
                            placeholder="geniuslibrarymadhupur@gmail.com" 
                            class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-navy focus:border-transparent transition"
                        />
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">Password</label>
                        <input 
                            type="password" 
                            id="loginPassword" 
                            required 
                            placeholder="Enter admin password" 
                            class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-navy focus:border-transparent transition"
                        />
                    </div>

                    <button 
                        type="submit" 
                        id="loginBtn"
                        class="w-full py-3 rounded-xl bg-navy hover:bg-navydark active:scale-98 text-gold font-bold text-xs shadow-md hover:shadow-lg transition-all flex items-center justify-center gap-2"
                    >
                        <span>Unlock WhatsApp Console</span>
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
                    </button>
                </form>
            `;
        }

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            btn.disabled = true;
            btn.innerHTML = 'Verifying...';

            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (data.success && data.token) {
                    setToken(data.token);
                    renderDashboard(data.username);
                    checkStatus();
                    startPolling();
                } else {
                    renderLoginForm(data.error || 'Galat ID ya Password!');
                }
            } catch (err) {
                renderLoginForm('Network error during login: ' + err.message);
            }
        }

        function renderDashboard(user) {
            const container = document.getElementById('mainContent');
            container.innerHTML = `
                <!-- Session Bar -->
                <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-100 text-xs">
                    <div class="flex items-center gap-1.5 text-slate-600">
                        <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                        <span class="font-bold truncate max-w-[190px]">${user || 'Admin'}</span>
                    </div>
                    <button 
                        onclick="lockConsole()" 
                        class="px-2.5 py-1 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-[11px] flex items-center gap-1 transition"
                    >
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                        <span>Lock Console</span>
                    </button>
                </div>

                <!-- Status Viewport -->
                <div id="botStatusViewport" class="flex flex-col items-center justify-center min-h-[280px]">
                    <div class="h-8 w-8 border-4 border-wa border-t-transparent rounded-full animate-spin mb-3"></div>
                    <p class="text-xs text-slate-500 font-medium">Loading WhatsApp Status...</p>
                </div>
            `;
        }

        async function checkStatus() {
            const token = getToken();
            if (!token) return;

            try {
                const res = await fetch('/status', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                
                if (res.status === 401) {
                    setToken('');
                    renderLoginForm('Session expired or unauthorized. Please login again.');
                    return;
                }

                const data = await res.json();
                const viewport = document.getElementById('botStatusViewport');
                if (!viewport) return;

                if (data.isConnected) {
                    viewport.innerHTML = `
                        <div class="w-full space-y-4">
                            <!-- Connected Card -->
                            <div class="flex items-center justify-between bg-emerald-50 border border-emerald-200/80 p-4 rounded-2xl">
                                <div class="flex items-center gap-3">
                                    <div class="relative flex h-3 w-3">
                                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                                        <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
                                    </div>
                                    <div>
                                        <p class="text-[10px] text-emerald-800 font-bold uppercase tracking-wider">Status</p>
                                        <p class="text-sm font-extrabold text-slate-800">WhatsApp Online</p>
                                    </div>
                                </div>
                                <div class="text-right">
                                    <p class="text-[10px] text-emerald-800 font-bold uppercase tracking-wider">Connected Number</p>
                                    <p class="text-xs font-black text-slate-800 font-mono">+${data.userNumber || 'Active'}</p>
                                </div>
                            </div>

                            <!-- Stats Grid -->
                            <div class="grid grid-cols-2 gap-2.5 text-left">
                                <div class="bg-slate-50 p-3 rounded-xl border border-slate-100">
                                    <p class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Messages Sent</p>
                                    <p class="text-lg font-black text-wa mt-0.5">${data.stats?.totalMessagesSent || 0}</p>
                                </div>
                                <div class="bg-slate-50 p-3 rounded-xl border border-slate-100">
                                    <p class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Bot Uptime</p>
                                    <p class="text-xs font-bold text-slate-700 mt-1 font-mono">${data.stats?.botUptime || 'Active'}</p>
                                </div>
                                <div class="bg-slate-50 p-3 rounded-xl border border-slate-100 col-span-2 flex items-center justify-between">
                                    <div>
                                        <p class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Last Sent Message</p>
                                        <p class="text-xs font-bold text-slate-700 mt-0.5">${data.stats?.lastMessageTime || 'None yet'}</p>
                                    </div>
                                    <svg class="w-4 h-4 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                                </div>
                            </div>

                            <!-- Logout WhatsApp Device (Requires confirmation) -->
                            <div class="pt-2">
                                <button 
                                    onclick="confirmLogoutDevice()" 
                                    class="w-full py-2.5 rounded-xl border border-red-200 bg-red-50/50 hover:bg-red-100/80 text-red-700 font-bold text-xs flex items-center justify-center gap-1.5 transition active:scale-98"
                                >
                                    <svg class="w-4 h-4 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                                    <span>Unlink / Logout WhatsApp Device</span>
                                </button>
                            </div>
                        </div>
                    `;
                } else if (data.qrImage) {
                    viewport.innerHTML = `
                        <div class="text-center space-y-3">
                            <div>
                                <h3 class="text-base font-extrabold text-navy">Scan QR to Connect WhatsApp</h3>
                                <p class="text-xs text-slate-500 mt-0.5">WhatsApp > Linked Devices > Link a Device</p>
                            </div>
                            <div class="p-3 bg-white rounded-2xl shadow-md border-2 border-dashed border-wa inline-block">
                                <img src="${data.qrImage}" alt="WhatsApp QR Code" class="w-52 h-52 rounded-xl">
                            </div>
                            <p class="text-[11px] text-slate-400 font-medium">QR updates automatically. Scan within 20 seconds.</p>
                        </div>
                    `;
                } else {
                    viewport.innerHTML = `
                        <div class="text-center py-6">
                            <div class="h-8 w-8 border-4 border-navy border-t-transparent rounded-full animate-spin mx-auto mb-3"></div>
                            <p class="text-xs font-bold text-slate-700">Initializing WhatsApp Engine...</p>
                            <p class="text-[11px] text-slate-400 mt-1">Waiting for QR or connection status</p>
                        </div>
                    `;
                }
            } catch (err) {
                console.error('Status check error:', err);
            }
        }

        async function confirmLogoutDevice() {
            const confirmed = confirm('⚠️ Kya aap sach me library ka WhatsApp device logout karna chahte hain?\n\nIske baad check-in/out messages bhejna band ho jayega jab tak aap firse QR scan na karein.');
            if (!confirmed) return;

            const token = getToken();
            try {
                const res = await fetch('/logout', {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const data = await res.json();
                if (data.success) {
                    alert('✓ WhatsApp device successfully logged out!');
                    checkStatus();
                } else {
                    alert('Error: ' + (data.error || 'Failed to logout'));
                }
            } catch (e) {
                alert('Request failed: ' + e.message);
            }
        }

        async function lockConsole() {
            const token = getToken();
            try {
                await fetch('/api/logout-session', {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + token }
                });
            } catch {}
            setToken('');
            renderLoginForm('Console locked successfully. Enter ID and Password to reopen.');
        }

        function startPolling() {
            if (pollTimer) clearInterval(pollTimer);
            pollTimer = setInterval(checkStatus, 3000);
        }

        init();
    </script>
</body>
</html>

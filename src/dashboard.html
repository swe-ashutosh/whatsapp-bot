<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jugaduji WhatsApp API</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: { colors: { wa: '#25D366', wadark: '#128C7E' } }
            }
        }
    </script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4 font-sans text-slate-800">
    
    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-100">
        <div class="bg-gradient-to-r from-wadark to-wa p-5 text-center shadow-inner">
            <h2 class="text-2xl font-bold text-white flex items-center justify-center gap-2">
                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 0 0-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z"/></svg>
                Jugaduji API
            </h2>
            <p class="text-green-100 text-xs mt-1 opacity-90">Microservice Dashboard</p>
        </div>

        <div id="content" class="p-6 text-center min-h-[350px] flex flex-col items-center justify-center">
            <div class="h-8 w-8 border-4 border-wa border-t-transparent rounded-full animate-spin mb-4"></div>
            <p class="text-slate-500 text-sm">Loading...</p>
        </div>
        
        <div class="bg-slate-50 p-3 text-center border-t border-slate-100">
            <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Powered by Jugaduji</p>
        </div>
    </div>

    <script>
        async function checkStatus() {
            try {
                const res = await fetch('/status');
                const data = await res.json();
                const contentDiv = document.getElementById('content');

                if (data.isConnected) {
                    contentDiv.innerHTML = `
                        <div class="flex items-center justify-between w-full mb-5 bg-green-50 border border-green-100 p-3 rounded-lg">
                            <div class="flex items-center gap-3">
                                <div class="w-3 h-3 bg-green-500 rounded-full animate-pulse"></div>
                                <div class="text-left">
                                    <p class="text-[11px] text-green-700 font-bold uppercase tracking-wide">Status</p>
                                    <p class="text-sm font-bold text-slate-800">Connected</p>
                                </div>
                            </div>
                            <div class="text-right">
                                <p class="text-[11px] text-green-700 font-bold uppercase tracking-wide">Number</p>
                                <p class="text-sm font-bold text-slate-800">+${data.userNumber}</p>
                            </div>
                        </div>

                        <!-- Statistics Grid -->
                        <div class="grid grid-cols-2 gap-3 w-full mb-6 text-left">
                            <div class="bg-slate-50 p-3 rounded-xl border border-slate-100 shadow-sm">
                                <p class="text-[10px] text-slate-400 font-bold uppercase">Total Sent</p>
                                <p class="text-xl font-black text-wa mt-1">${data.stats.totalMessagesSent}</p>
                            </div>
                            <div class="bg-slate-50 p-3 rounded-xl border border-slate-100 shadow-sm">
                                <p class="text-[10px] text-slate-400 font-bold uppercase">Bot Uptime</p>
                                <p class="text-sm font-bold text-slate-700 mt-1">${data.stats.botUptime}</p>
                            </div>
                            <div class="bg-slate-50 p-3 rounded-xl border border-slate-100 shadow-sm col-span-2 flex justify-between items-center">
                                <div>
                                    <p class="text-[10px] text-slate-400 font-bold uppercase">Last Message Sent</p>
                                    <p class="text-sm font-bold text-slate-700 mt-1">${data.stats.lastMessageTime}</p>
                                </div>
                                <svg class="w-5 h-5 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            </div>
                        </div>

                        <button onclick="logout()" class="w-full bg-white hover:bg-red-50 text-slate-600 hover:text-red-600 font-semibold py-2.5 border border-slate-200 hover:border-red-200 rounded-lg shadow-sm transition-all flex items-center justify-center gap-2 text-sm">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                            Logout Device
                        </button>
                    `;
                } else if (data.qrImage) {
                    contentDiv.innerHTML = `
                        <h3 class="text-lg font-bold text-slate-800 mb-1">Scan to Connect</h3>
                        <p class="text-xs text-slate-500 mb-5">Open WhatsApp > Linked Devices > Link a Device</p>
                        <div class="bg-white p-3 rounded-2xl shadow-sm border border-slate-200 inline-block mb-2">
                            <img src="${data.qrImage}" alt="QR Code" class="w-48 h-48 rounded-lg">
                        </div>
                    `;
                }
            } catch (error) {
                console.error("Error fetching status", error);
            }
        }

        async function logout() {
            if(confirm("Logout karna hai?")) {
                document.getElementById('content').innerHTML = `<p class="text-slate-500">Logging out...</p>`;
                await fetch('/logout', { method: 'POST' });
            }
        }

        setInterval(checkStatus, 3000);
        checkStatus(); 
    </script>
</body>
</html>
